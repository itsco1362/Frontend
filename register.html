<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — MyApp</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <div class="card">

        <div class="brand">
            <div class="brand-icon">⚡</div>
            <h1>Create account</h1>
            <p>Join us today, it's free</p>
        </div>

        <form>
            <div class="form-group">
                <label for="fullname">Full name</label>
                <input type="text" id="fullname" placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Min. 8 characters">
            </div>

            <div class="form-group">
                <label for="confirm">Confirm password</label>
                <input type="password" id="confirm" placeholder="Repeat your password">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms">
                <label for="terms">I agree to the <a href="#">Terms of Service</a></label>
            </div>

            <button type="submit" class="btn">Create account</button>
        </form>

        <div class="footer-link">
            Already have an account? <a href="login.html">Sign in</a>
        </div>

    </div>

</body>
</html>
